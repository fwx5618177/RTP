version: '3.8'

services:
  # Janus WebRTC Gateway
  janus-gateway:
    container_name: rtp-bridge-janus
    image: canyan/janus-gateway:latest
    command: [ "/usr/local/bin/janus", "-F", "/usr/local/etc/janus" ]
    ports:
      - "8088:8088"
      - "8089:8089"
      - "8889:8889"
      - "8000:8000"
      - "7088:7088"
      - "7089:7089"
      - "10000-20000:10000-20000/udp"
    volumes:
      - ./dockers/config/janus.jcfg:/usr/local/etc/janus/janus.jcfg
      - ./dockers/config/janus.eventhandler.sampleevh.jcfg:/usr/local/etc/janus/janus.eventhandler.sampleevh.jcfg
      - ./dockers/logs/janus:/var/log/janus
    networks:
      - rtp-bridge
    restart: always
    environment:
      - JANUS_API_SECRET=janusrocks
      - JANUS_LOG_LEVEL=4

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: rtp-bridge-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rtp_bridge
      MYSQL_USER: rtp
      MYSQL_PASSWORD: rtp123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rtp-bridge
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for session management
  redis:
    image: redis:alpine
    container_name: rtp-bridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rtp-bridge
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
  redis_data:


networks:
  rtp-bridge:
    driver: bridge

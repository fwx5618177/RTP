version: '3.8'

services:
  # Janus Gateway
  janus-gateway:
    container_name: rtp-bridge-janus
    image: canyan/janus-gateway:latest
    command: >
      sh -c "apt-get update && 
             apt-get install -y procps && 
             /usr/local/bin/janus -F /usr/local/etc/janus"
    tty: true
    stdin_open: true
    ports:
      - "8088:8088" # REST API
      - "8089:8089" # HTTPS REST API
      - "8889:8889" # WebSocket
      - "8000:8000" # HTTPS WebSocket
      - "7088:7088" # Admin API
      - "7089:7089" # HTTPS Admin API
      - "5060:5060/udp" # SIP UDP - 确保这个端口映射正确
    volumes:
      - ./dockers/config/janus.jcfg:/usr/local/etc/janus/janus.jcfg
      - ./dockers/config/janus.plugin.sip.jcfg:/usr/local/etc/janus/janus.plugin.sip.jcfg
      - ./dockers/config/janus.eventhandler.sampleevh.jcfg:/usr/local/etc/janus/janus.eventhandler.sampleevh.jcfg
      - ./dockers/logs/janus:/var/log/janus
    networks:
      rtp-bridge:
        aliases:
          - janus-gateway
        ipv4_address: 172.21.0.2 # 固定 IP 地址
    restart: unless-stopped
    environment:
      - JANUS_API_SECRET=janusrocks
      - JANUS_LOG_LEVEL=7
      - JANUS_SIP_INTERFACE=0.0.0.0 # 监听所有接口
      - JANUS_DEBUG_LEVEL=7 # 最详细的日志级别
    healthcheck:
      test: [ "CMD", "pgrep", "janus" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: rtp-bridge-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rtp_bridge
      MYSQL_USER: rtp
      MYSQL_PASSWORD: rtp123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rtp-bridge
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for session management
  redis:
    image: redis:alpine
    container_name: rtp-bridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rtp-bridge
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
  redis_data:


networks:
  rtp-bridge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

[general]
static=yes
writeprotect=no
clearglobalvars=no
priorityjumping=no

[globals]
JANUS_BRIDGE=rtp-bridge-backend:5060

[default]
; 处理来自SIP终端的呼叫到Janus房间
exten => _9.,1,NoOp(Incoming call to Janus room ${EXTEN:1})
same => n,Set(ROOM_NUMBER=${EXTEN:1})
same => n,Set(JANUS_ROOM=sip:${ROOM_NUMBER}@${JANUS_BRIDGE})
same => n,Set(SIPADDHEADER01=X-Room-Number: ${ROOM_NUMBER})
same => n,Set(SIPADDHEADER02=X-Janus-Room: ${ROOM_NUMBER})
same => n,Set(SIPADDHEADER03=X-Source: asterisk)
same => n,Dial(SIP/${JANUS_ROOM},60,tT)
same => n,Hangup()

[janus-bridge]
; 处理来自Janus的呼叫
exten => _.,1,NoOp(Incoming call from Janus)
same => n,Answer()
same => n,Set(CHANNEL(audioreadformat)=opus,alaw,ulaw)
same => n,Set(CHANNEL(audiowriteformat)=opus,alaw,ulaw)
same => n,Echo()
same => n,Hangup()
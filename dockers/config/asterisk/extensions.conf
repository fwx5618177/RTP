[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
JANUS_GATEWAY=SIP/janus-gateway

[default]
; 允许 SIP 用户之间互相拨打
exten => _6XXX,1,NoOp(Dialed extension ${EXTEN})
same => n,Dial(SIP/${EXTEN},30)
same => n,Hangup()

; Echo 测试
exten => 7000,1,Answer()
same => n,Echo()
same => n,Hangup()

; 转发到 Janus WebRTC 房间
exten => _9XXX,1,NoOp(Forwarding to Janus WebRTC room ${EXTEN:1})
same => n,Set(ROOM_NUMBER=${EXTEN:1})
same => n,Set(CALLERID(name)=SIP-${CALLERID(num)})
same => n,Set(__SIPADDHEADER01=X-Room-Number: ${ROOM_NUMBER})
same => n,Set(__SIPADDHEADER02=X-Janus-Room: ${ROOM_NUMBER})
same => n,Set(__SIPADDHEADER03=X-Source: asterisk)
same => n,Set(__SIPADDHEADER04=X-Conference-Room: ${ROOM_NUMBER})
same => n,Set(__SIPADDHEADER05=X-Conference-Server: rtp-bridge-janus)
same => n,Dial(${JANUS_GATEWAY},30,b)
same => n,Hangup()

[janus-context]
; 处理来自 Janus 的呼叫
exten => _X.,1,NoOp(Incoming WebRTC call from Janus)
same => n,Set(CALLERID(name)=WebRTC-${CALLERID(num)})
same => n,Dial(SIP/${EXTEN},30)
same => n,Hangup()

; 处理来自 Janus 的 DTMF
exten => _*X.,1,NoOp(DTMF from Janus: ${EXTEN:1})
same => n,Set(DTMF_DIGITS=${EXTEN:1})
same => n,NoOp(Processing DTMF: ${DTMF_DIGITS})
same => n,Hangup()
[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
JANUS_SIP=SIP/janus-sip

[default]
; 允许用户之间互相拨打
exten => _6XXX,1,NoOp(Dialed extension ${EXTEN})
same => n,Dial(SIP/${EXTEN},30)
same => n,Hangup()

; Echo 测试
exten => 7000,1,Answer()
same => n,Echo()
same => n,Hangup()

; 语音信箱
exten => 8000,1,Answer()
same => n,VoiceMail(${EXTEN}@default)
same => n,Hangup()

; 转发到 Janus 房间
exten => _9XXX,1,NoOp(Forwarding to Janus room ${EXTEN:1})
same => n,Set(ROOM_NUMBER=${EXTEN:1})
same => n,Set(CALLERID(name)=PBX-${CALLERID(name)})
same => n,Set(SIPADDHEADER(X-Room-Number)=${ROOM_NUMBER})
same => n,Dial(${JANUS_SIP}/${ROOM_NUMBER},30,b(add-headers^s^1))
same => n,Hangup()

[add-headers]
exten => s,1,NoOp(Adding SIP headers)
same => n,Set(SIPADDHEADER(X-Janus-Room)=${ROOM_NUMBER})
same => n,Set(SIPADDHEADER(X-Source)=asterisk)
same => n,Return

[janus-incoming]
exten => _XXX,1,NoOp(Incoming call from Janus for extension ${EXTEN})
same => n,Dial(SIP/${EXTEN},30)
same => n,Hangup() 
[general]
context=default
allowguest=no
alwaysauthreject=yes
bindport=5060
bindaddr=0.0.0.0
srvlookup=yes
disallow=all
allow=opus
allow=ulaw
allow=alaw
language=en
qualify=yes
register_timeout=60
registertimeout=60
dtmfmode=rfc2833
nat=force_rport,comedia
directmedia=no
videosupport=no

[template-user](!)
type=friend
host=dynamic
context=default
disallow=all
allow=opus
allow=ulaw
allow=alaw
qualify=yes
nat=force_rport,comedia
dtmfmode=rfc2833
directmedia=no

[6001](template-user)
secret=password6001
callerid="User One" <6001>

[6002](template-user)
secret=password6002
callerid="User Two" <6002>

; Janus SIP Gateway 配置
[janus-gateway]
type=peer
host=172.18.0.4
context=janus-context
username=janus-sip
secret=janusSecret123
disallow=all
allow=opus
allow=ulaw
allow=alaw
directmedia=no
qualify=yes
nat=force_rport,comedia
insecure=port,invite
dtmfmode=rfc2833
canreinvite=no
context=janus-context
fromdomain=rtp-bridge-janus
transport=udp
encryption=no
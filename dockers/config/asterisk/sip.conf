[general]
context=default
allowguest=no
alwaysauthreject=yes
bindport=5060
bindaddr=0.0.0.0
srvlookup=yes
disallow=all
allow=ulaw
allow=alaw
allow=gsm
allow=opus
language=en
qualify=yes
register_timeout=60
registertimeout=60

[template-user](!)
type=friend
host=dynamic
context=default
disallow=all
allow=ulaw
allow=alaw
allow=gsm
allow=opus
qualify=yes
nat=force_rport,comedia

[6001](template-user)
secret=password6001
callerid="User One" <6001>

[6002](template-user)
secret=password6002
callerid="User Two" <6002>

; Janus SIP Gateway 配置
[janus-sip](!)
type=friend
host=dynamic
context=janus-incoming
secret=janusSecret123
disallow=all
allow=ulaw
allow=alaw
allow=gsm
allow=opus
directmedia=no
qualify=yes
nat=force_rport,comedia
insecure=port,invite
dtmfmode=rfc2833
canreinvite=no

[janus-sip]
type=friend
host=172.18.0.4
username=janus-sip
secret=janusSecret123
context=janus-incoming
fromdomain=rtp-bridge-janus 
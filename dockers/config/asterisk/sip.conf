[general]
context=default
allowguest=no
allowoverlap=no
udpbindaddr=0.0.0.0:5060
tcpenable=yes
tcpbindaddr=0.0.0.0:5060
externaddr=rtp-bridge-backend:5061
transport=udp,tcp
srvlookup=yes
qualify=yes
alwaysauthreject=yes
directmedia=no
videosupport=no
disallow=all
allow=opus
allow=alaw
allow=ulaw
allow=g722
rtptimeout=60
rtpholdtimeout=300
rtsavesysname=yes
rtupdate=yes

[authentication]
; 添加认证配置

[janus-bridge]
type=friend
host=rtp-bridge-backend
context=janus-bridge
disallow=all
allow=opus
allow=alaw
allow=ulaw
allow=g722
qualify=yes
nat=force_rport,comedia
directmedia=no
videosupport=no
rtptimeout=60
rtpholdtimeout=300
callcounter=yes

[template-user](!)
type=friend
host=dynamic
context=default
disallow=all
allow=opus
allow=ulaw
allow=alaw
qualify=yes
nat=force_rport,comedia
dtmfmode=rfc2833
directmedia=no

[6001](template-user)
secret=password6001
callerid="User One" <6001>

[6002](template-user)
secret=password6002
callerid="User Two" <6002>

; Janus SIP Gateway 配置
[janus-gateway]
type=peer
host=172.18.0.4
context=janus-context
username=janus-sip
secret=janusSecret123
disallow=all
allow=opus
allow=ulaw
allow=alaw
directmedia=no
qualify=yes
nat=force_rport,comedia
insecure=port,invite
dtmfmode=rfc2833
canreinvite=no
context=janus-context
fromdomain=rtp-bridge-janus
transport=udp
encryption=no

[signaling-server]
type=peer
host=127.0.0.1
port=5060
context=janus-bridge
disallow=all
allow=opus
allow=ulaw
allow=alaw
allow=g722
directmedia=no
qualify=yes
nat=force_rport,comedia
insecure=port,invite
dtmfmode=rfc2833
canreinvite=no
context=janus-bridge
fromdomain=rtp-bridge-backend
transport=udp,tcp
encryption=no
rtptimeout=60
rtpholdtimeout=300
rtsavesysname=yes
rtupdate=yes